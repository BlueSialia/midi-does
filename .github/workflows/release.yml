name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev libpipewire-0.3-dev libasound2-dev libudev-dev libvulkan-dev libxkbcommon-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev libxinerama-dev libxxf86vm-dev libwayland-dev dpkg-dev liblzma-dev
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Determine release
        id: metadata
        env:
          # Set this to a package name when the workspace has more than one package.
          PACKAGE: ""
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1 --no-deps)"

          if [ -n "$PACKAGE" ]; then
            package="$(jq -c --arg name "$PACKAGE" 'first(.packages[] | select(.name == $name)) // empty' <<<"$metadata")"
          else
            package="$(jq -c --arg manifest "$GITHUB_WORKSPACE/Cargo.toml" '
              if (.packages | length) == 1 then .packages[0]
              else first(.packages[] | select(.manifest_path == $manifest)) // empty
              end
            ' <<<"$metadata")"
          fi

          if [ -z "$package" ]; then
            echo "::error::Could not determine the package to release. Set PACKAGE to one of:"
            jq -r '.packages[].name' <<<"$metadata"
            exit 1
          fi

          name="$(jq -r '.name' <<<"$package")"
          version="$(jq -r '.version' <<<"$package")"
          tag="v${version}"

          should_release=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; nothing to publish."
          elif ! grep -qF "## [$version]" CHANGELOG.md && ! grep -qF "## [v$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version; nothing to publish."
          else
            should_release=true
          fi

          {
            echo "should_release=$should_release"
            echo "name=$name"
            echo "version=$version"
            echo "tag=$tag"
            echo "bins<<EOF"
            jq -r '.targets[] | select(.kind | index("bin")) | "target/release/\(.name)"' <<<"$package"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.metadata.outputs.should_release == 'true'
        run: cargo test --workspace --locked
      - name: Build release binary
        if: steps.metadata.outputs.should_release == 'true'
        run: cargo build --release --locked -p "${{ steps.metadata.outputs.name }}"
      - name: Strip release binary
        if: steps.metadata.outputs.should_release == 'true'
        run: strip -s target/release/midi-does
      - name: Build Debian package
        if: steps.metadata.outputs.should_release == 'true'
        run: cargo deb --no-build
      - name: Build RPM package
        if: steps.metadata.outputs.should_release == 'true'
        run: cargo generate-rpm
      - name: Package Nix recipe
        if: steps.metadata.outputs.should_release == 'true'
        run: tar -czf "midi-does-${{ steps.metadata.outputs.version }}-nix.tar.gz" flake.nix flake.lock
      - name: Generate release notes
        if: steps.metadata.outputs.should_release == 'true'
        run: awk '/^## \[/{count++} count==1' CHANGELOG.md > release-notes.md
      - name: Publish release
        if: steps.metadata.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.metadata.outputs.tag }}
          body_path: release-notes.md
          files: |
            target/release/midi-does
            target/debian/*.deb
            target/generate-rpm/*.rpm
            midi-does-*-nix.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
