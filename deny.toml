# cargo-deny configuration for midi-does.

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-4-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDDL-1.0",
    "EPL-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "LicenseRef-Hippocratic-3.0",
]

[[licenses.clarify]]
name = "midi-does"
expression = "LicenseRef-Hippocratic-3.0"
license-files = [{ path = "LICENSE.md", hash = 0xd9915fd9 }]

[licenses.private]
ignore = true

[bans]
# iced and its GUI dependency tree legitimately ship multiple versions of
# several crates, so duplicates are warned rather than denied.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
